[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvsnap"
version = "0.1.0"
description = "GLM-5.3 1M KV 缓存落盘恢复，信创气隙部署专用"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "SuperMarioYL" }]
keywords = [
    "vllm",
    "glm",
    "kv-cache",
    "checkpoint",
    "xinChuang",
    "air-gap",
    "llm",
    "inference",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "torch>=2.4",
    "click>=8.1",
    "rich>=13.0",
    "xxhash>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
vllm = ["vllm>=0.6.0"]
dev = ["pytest>=8.0", "build>=1.0"]

[project.scripts]
kvsnap = "kvsnap.cli:main"

[project.urls]
Homepage = "https://github.com/SuperMarioYL/kvsnap"
Documentation = "https://github.com/SuperMarioYL/kvsnap#readme"
Issues = "https://github.com/SuperMarioYL/kvsnap/issues"

[tool.setuptools]
packages = ["kvsnap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
