<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465" data-palette="5671e6-966ae7-acd5f6-60968e5ac74e" role="img" aria-labelledby="process-dark-title process-dark-desc"><title id="process-dark-title">KVSnap process</title><desc id="process-dark-desc">Five blobs verify; K/V tensors and block_map are equal after restoration.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x2="1000" y2="465"><stop stop-color="#5974e6"/><stop offset=".6" stop-color="#966ae7"/><stop offset="1" stop-color="#acd5f6"/></linearGradient><radialGradient id="halo"><stop stop-color="#5974e6" stop-opacity=".22"/><stop offset="1" stop-color="#050812" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#171f41" stroke-opacity=".35" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#5974e6" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans",sans-serif}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.turn{transform-box:fill-box;transform-origin:center;animation:turn 36s linear infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}.flow{display:none}}</style><rect width="1000" height="465" rx="16" fill="#050812"/><rect width="1000" height="465" rx="16" fill="url(#grid)"/><ellipse cx="630.0" cy="199.95" rx="500.0" ry="325.5" fill="url(#halo)"/><text x="44" y="44" fill="#95a2c4" font-size="13" text-anchor="start" font-weight="400">PROCESS / FROM INPUT TO RESULT</text><text x="44" y="84.0" fill="#eef7fd" font-size="30" text-anchor="start" font-weight="400">KVSnap / example workflow</text><path d="M254.0 237H278.0" fill="none" stroke="#5974e6" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M254.0 237H278.0" class="flow" fill="none" stroke="#acd5f6" stroke-width="2"/><rect x="44.0" y="176" width="210.0" height="122" rx="12" fill="#0c111f" stroke="#171f41"/><text x="62.0" y="207.0" fill="#eef7fd" font-size="21" text-anchor="start" font-weight="400">01  Create CPU</text><text x="62.0" y="236.4" fill="#eef7fd" font-size="21" text-anchor="start" font-weight="400">tensors</text><text x="62.0" y="259.0" fill="#95a2c4" font-size="17" text-anchor="start" font-weight="400">Seed 42 / two</text><text x="62.0" y="282.8" fill="#95a2c4" font-size="17" text-anchor="start" font-weight="400">layers</text><path d="M488.0 237H512.0" fill="none" stroke="#5974e6" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M488.0 237H512.0" class="flow" fill="none" stroke="#acd5f6" stroke-width="2"/><rect x="278.0" y="176" width="210.0" height="122" rx="12" fill="#0c111f" stroke="#171f41"/><text x="296.0" y="207.0" fill="#eef7fd" font-size="21" text-anchor="start" font-weight="400">02  Save</text><text x="296.0" y="236.4" fill="#eef7fd" font-size="21" text-anchor="start" font-weight="400">snapshot</text><text x="296.0" y="259.0" fill="#95a2c4" font-size="17" text-anchor="start" font-weight="400">Manifest plus</text><text x="296.0" y="282.8" fill="#95a2c4" font-size="17" text-anchor="start" font-weight="400">five blobs</text><path d="M722.0 237H746.0" fill="none" stroke="#5974e6" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M722.0 237H746.0" class="flow" fill="none" stroke="#acd5f6" stroke-width="2"/><rect x="512.0" y="176" width="210.0" height="122" rx="12" fill="#0c111f" stroke="#171f41"/><text x="530.0" y="207.0" fill="#eef7fd" font-size="21" text-anchor="start" font-weight="400">03  Verify and</text><text x="530.0" y="236.4" fill="#eef7fd" font-size="21" text-anchor="start" font-weight="400">restore</text><text x="530.0" y="259.0" fill="#95a2c4" font-size="17" text-anchor="start" font-weight="400">Fresh in-memory</text><text x="530.0" y="282.8" fill="#95a2c4" font-size="17" text-anchor="start" font-weight="400">backend</text><rect x="746.0" y="176" width="210.0" height="122" rx="12" fill="#0c111f" stroke="#171f41"/><text x="764.0" y="207.0" fill="#eef7fd" font-size="21" text-anchor="start" font-weight="400">04  Compare</text><text x="764.0" y="236.4" fill="#eef7fd" font-size="21" text-anchor="start" font-weight="400">tensors</text><text x="764.0" y="259.0" fill="#95a2c4" font-size="17" text-anchor="start" font-weight="400">torch.equal</text><text x="764.0" y="282.8" fill="#95a2c4" font-size="17" text-anchor="start" font-weight="400">checks</text><text x="44" y="379.0" fill="#acd5f6" font-size="20" text-anchor="start" font-weight="400">Five blobs verify; K/V tensors and block_map are equal after restoration.</text></svg>
